name: Build Private Photo Vault iOS IPA (TrollStore)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release TrollStore IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: |
          xcodebuild -version || true

      - name: Compile Swift directly to iOS ARM64 Binary
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK at: $SDK_PATH"

          echo "=== Compiling with Swiftc (Release Mode) ==="
          SWIFT_FILES=$(find PrivatePhotoVault -name "*.swift")
          echo "Compiling $(echo "$SWIFT_FILES" | wc -l) Swift source files..."

          mkdir -p build_output

          swiftc -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 -Xlinker -syslibroot -Xlinker "$SDK_PATH" \
                 -parse-as-library \
                 -O \
                 -framework Foundation \
                 -framework SwiftUI \
                 -framework UIKit \
                 -framework Photos \
                 -framework PhotosUI \
                 -framework AVFoundation \
                 -framework AVKit \
                 -framework UniformTypeIdentifiers \
                 -framework LocalAuthentication \
                 -framework CryptoKit \
                 -framework Security \
                 -framework CoreGraphics \
                 -framework Combine \
                 $SWIFT_FILES \
                 -o build_output/PrivatePhotoVault 2>&1 | tee compile.log

          SWIFTC_STATUS=${PIPESTATUS[0]}
          echo "Swiftc exit code: $SWIFTC_STATUS"

          if [ $SWIFTC_STATUS -ne 0 ] || [ ! -f build_output/PrivatePhotoVault ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E "error:|warning:" compile.log | head -n 30)
            exit 1
          fi

      - name: Assemble TrollStore IPA Bundle
        run: |
          echo "=== Assembling App Bundle ==="
          mkdir -p Payload/PrivatePhotoVault.app
          mv build_output/PrivatePhotoVault Payload/PrivatePhotoVault.app/PrivatePhotoVault

          # Info.plist
          if [ -f "PrivatePhotoVault/Resources/Info.plist" ]; then
            cp "PrivatePhotoVault/Resources/Info.plist" Payload/PrivatePhotoVault.app/Info.plist
          fi

          # PkgInfo
          echo "APPL????" > Payload/PrivatePhotoVault.app/PkgInfo

          # Entitlements (get-task-allow = false -> No Developer Mode required!)
          if [ -f "PrivatePhotoVault/Resources/entitlements.plist" ]; then
            cp "PrivatePhotoVault/Resources/entitlements.plist" Payload/PrivatePhotoVault.app/entitlements.plist
          fi

          # Copy Decoy and Icon Assets
          if [ -f "PrivatePhotoVault/Resources/001.png" ]; then
            cp "PrivatePhotoVault/Resources/001.png" Payload/PrivatePhotoVault.app/
          fi

          cp PrivatePhotoVault/Resources/AppIcon*.png Payload/PrivatePhotoVault.app/ 2>/dev/null || true
          cp -f PrivatePhotoVault/Resources/AppIcon60x60@2x.png Payload/PrivatePhotoVault.app/AppIcon60x60.png 2>/dev/null || true
          cp -f PrivatePhotoVault/Resources/AppIcon76x76@2x.png Payload/PrivatePhotoVault.app/AppIcon76x76.png 2>/dev/null || true
          cp -f PrivatePhotoVault/Resources/AppIcon.png Payload/PrivatePhotoVault.app/AppIcon.png 2>/dev/null || true

          # Compile Assets Catalog
          if [ -d "PrivatePhotoVault/Resources/Assets.xcassets" ]; then
            actool --output-format human-readable-text \
                   --notices --warnings \
                   --platform iphoneos \
                   --target-device iphone \
                   --target-device ipad \
                   --minimum-deployment-target 15.0 \
                   --app-icon AppIcon \
                   --compile Payload/PrivatePhotoVault.app \
                   PrivatePhotoVault/Resources/Assets.xcassets || true
          fi

          echo "=== Ad-Hoc & TrollStore Codesign (No Developer Mode) ==="
          if [ -f "Payload/PrivatePhotoVault.app/entitlements.plist" ]; then
            codesign -s - -f --entitlements Payload/PrivatePhotoVault.app/entitlements.plist Payload/PrivatePhotoVault.app/PrivatePhotoVault || true
            codesign -s - -f --entitlements Payload/PrivatePhotoVault.app/entitlements.plist Payload/PrivatePhotoVault.app || true
          fi

          if command -v ldid &> /dev/null; then
            ldid -SPayload/PrivatePhotoVault.app/entitlements.plist Payload/PrivatePhotoVault.app/PrivatePhotoVault || true
          fi

          zip -r -9 PrivatePhotoVault.ipa Payload

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivatePhotoVault-IPA
          path: PrivatePhotoVault.ipa

      - name: Create or Update GitHub Release for High-Speed Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: "v1.3.0"
          name: "Private Photo Vault iOS (TrollStore Edition) v1.3.0"
          body: |
            🔒 **Bản IPA Cài Đặt Trực Tiếp Qua TrollStore Cho iPhone (Phiên Bản Khắc Phục Triệt Để Văng App & Nạp Ảnh/Video v1.3.0)**
            
            ✨ **Những nâng cấp và sửa lỗi cốt lõi trong v1.3.0:**
            - 🚀 **Bộ chọn ảnh Native thuần SwiftUI (In-Process)**: Thay thế hoàn toàn bộ chọn ngoài hệ thống (XPC) bằng `NativePhotoPickerView`. Triệt tiêu hoàn toàn lỗi văng app (crash/exit) do xung đột sandbox / tiến trình ngoại vi trên TrollStore.
            - 🎥 **Hỗ trợ 100% Ảnh & Video chất lượng gốc**: Trích xuất luồng nhị phân nguyên bản (HEIC, RAW, Apple ProRes, 4K/60fps MOV, MP4) qua `PHAssetResourceManager` mà không tốn RAM và không làm giảm chất lượng.
            - 🛡️ **Kiểm tra vật lý tệp trước khi hỏi xóa ảnh gốc**: Tự động xác thực tệp đã được ghi và mã hóa thực sự thành công trên đĩa bộ nhớ máy trước khi hiển thị hộp thoại hỏi xóa tệp gốc, bảo vệ tuyệt đối dữ liệu quý giá của bạn.
            - 🔔 **Ngụy trang VCB Digibank bí mật**: Yêu cầu nhấp đúng **10 lần liên tiếp** vào biểu tượng Thông báo (hình quả chuông có chấm đỏ 9+) mới hiện hộp thoại nhập mật mã (`36@Hamnghi`). Nhấp vào điểm khác sẽ lập tức đóng app.
            - 🎨 **App Icon sắc nét trên SpringBoard**: Tích hợp đầy đủ cấu hình icon ở mọi độ phân giải trong Info.plist và Assets.car, khắc phục triệt để hiện tượng mất icon trên màn hình chính.
            - ⚡ **Chạy trực tiếp không cần Developer Mode**: Được cấu hình entitlements chuẩn TrollStore, không cần bật chế độ nhà phát triển, không cần chứng chỉ gia hạn 7 ngày, vĩnh viễn không hết hạn.
            
            📲 **Cài đặt**: Tải file `PrivatePhotoVault.ipa` bên dưới và chia sẻ/mở bằng ứng dụng **TrollStore** trên iPhone!
          files: PrivatePhotoVault.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
